<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mega Piano Studio | Calendar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&family=Niconne&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --brand-yellow: #ffd145;
            --brand-gold: #c99b1d;
            --warm-cream: #faf8f2;
            --soft-cream: #f2eee5;
            --charcoal: #201f1c;
            --soft-charcoal: #4f4b44;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--warm-cream);
            color: var(--charcoal);
            font-family: "Montserrat", sans-serif;
        }

        /* MENU */

        .menu {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
        }

        .menu-button {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: var(--charcoal);
            color: var(--warm-cream);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
        }

        .menu-icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        .menu-links {
            position: absolute;
            top: 100%;
            left: 0;
            width: 220px;
            margin-top: 8px;
            background: var(--white);
            border-radius: 4px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                visibility 0.25s ease;
        }

        .menu.open .menu-links {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-links a {
            display: block;
            padding: 15px 20px;
            color: var(--charcoal);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--soft-cream);
            transition:
                background 0.2s ease,
                padding-left 0.2s ease;
        }

        .menu-links a:last-child {
            border-bottom: none;
        }

        .menu-links a:hover {
            background: var(--soft-cream);

            padding-left: 26px;
        }

        .submenu {
            background: #f7f4ec;
        }

        .submenu a {
            padding-left: 35px;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.06em;
        }

        .submenu a:hover {
            padding-left: 41px;
        }

        /* HERO */

        .hero {
            min-height: 28vh;
            padding: 35px 30px 25px;
            background: linear-gradient(
                135deg,
                rgba(255, 209, 69, 0.97),
                rgba(255, 225, 135, 0.92)
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-family: "Niconne", cursive;
            font-size: clamp(4.5rem, 8vw, 7rem);
            font-weight: normal;
            line-height: 1;
            color: var(--charcoal);
            margin-bottom: 18px;
        }

        .hero h1 a {
            color: var(--charcoal);
            text-decoration: none;
            }

        .hero h4 {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #5a5138;
            margin-bottom: 25px;
        }

        .hero-rule {
            width: 70px;
            height: 2px;
            background: var(--charcoal);
        }

        /* CALENDAR */

        .calendar-section {
            width: calc(100% - 60px);
            max-width: 1000px;
            margin: 60px auto 120px;
            padding: 0 30px;
            text-align: center;
        }

        .pdf-container {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .pdf-container iframe {
            display: block;
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 4px;
        }

        /* DOWNLOAD BUTTON */

        .download-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: var(--charcoal);
            color: var(--warm-cream);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 4px;
            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }

        .download-button:hover {
            background: var(--brand-gold);
            transform: translateY(-2px);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .menu {
                top: 15px;
                left: 15px;
            }

            .hero {
                min-height: 45vh;
                padding: 90px 25px 60px;
            }

            .hero h1 {
                font-size: 4.5rem;
            }

            .hero h4 {
                font-size: 0.7rem;
                letter-spacing: 0.14em;
            }

            .calendar-section {
                margin: 40px 15px 75px;
                padding: 0;
            }

            .pdf-container {
                padding: 10px;
            }

            .pdf-container iframe {
                height: 750px;
            }

            .download-button {
                margin-top: 20px;
                padding: 13px 23px;
            }
        }
    </style>
</head>

<body>

<!-- MENU -->

<nav class="menu">
    <div class="menu-button">
        <span class="menu-icon">☰</span>
        Menu
    </div>

    <div class="menu-links">
        <a href="https://megapianostudio.github.io/mps/studio">
            Studio
        </a>

        <div class="submenu">
            <a href="https://megapianostudio.github.io/mps/studio/courses">
                Courses
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/calendar">
                Calendar
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/teachers">
                Teachers
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/musicplayspace">
                Music Play Space
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/musictalk">
                Music Talk
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/testimonials">
                Testimonials
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/contact">
                Contact
            </a>
            <a href="https://megapianostudio.github.io/mps/studio/recruit">
                Recruit
            </a>
        </div>

        <a href="https://megapianostudio.github.io/mps/pianist">
            Pianist
        </a>

        <div class="submenu">
            <a href="https://megapianostudio.github.io/mps/pianist/repertoire">
                Repertoire
            </a>
            <a href="https://megapianostudio.github.io/mps/pianist/video">
                Video
            </a>
            <a href="https://megapianostudio.github.io/mps/pianist/newsounds">
                New Sounds
            </a>
            <a href="https://megapianostudio.github.io/mps/pianist/perform">
                Perform
            </a>
        </div>
    </div>
</nav>

<!-- HERO -->

<header class="hero">

<h1>
    <a href="../../index.html">Mega Piano Studio</a>
</h1>
    <h4>
        Calendar
    </h4>
    <div class="hero-rule"></div>
</header>

<!-- PDF -->

<section class="calendar-section">

    <div class="pdf-container">
        <iframe
            src="../other_files/4.pdf"
            title="Mega Piano Studio Calendar"
        ></iframe>
    </div>

    <a
        class="download-button"
        href="../../other_files/4.pdf"
        download
    >
        Download Calendar PDF
    </a>

</section>

<script>
    const menu = document.querySelector(".menu");
    const menuButton = document.querySelector(".menu-button");

    menuButton.addEventListener("click", function () {
        menu.classList.toggle("open");
    });

    document.addEventListener("click", function (event) {
        if (!menu.contains(event.target)) {
            menu.classList.remove("open");
        }
    });
    </script>
</body>
</html>
